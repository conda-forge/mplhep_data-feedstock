{% set name = "mplhep_data" %}
{% set version = "0.0.5" %}
{% set python_min = "3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4e5c4eae3e423762eb3d4ad542060f1be7f122c18a17164f7fcfedcf943fac7d

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >={{ python_min }}

test:
  imports:
    - mplhep_data
  commands:
    - pip check
    - pip show mplhep_data | grep "{{ version }}"
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/scikit-hep/mplhep_data
  license: MIT AND OFL-1.1 AND LPPL-1.3c
  license_file:
    - LICENSE
    - src/mplhep_data/fonts/firasans/LICENSE_FiraSans
    - src/mplhep_data/fonts/firamath/LICENSE_FiraMath
    - src/mplhep_data/fonts/texgyreheros/LICENSE_TexGyreHeros
  summary: Data sub-package for mplhep
  dev_url: https://github.com/scikit-hep/mplhep_data

extra:
  recipe-maintainers:
    - conda-forge/scikit-hep
    - andrzejnovak
    - chrisburr
